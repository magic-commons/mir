<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- THE PWA SHELL (BASINS' index.html): the page fills the whole screen, under the notch too (viewport-fit=cover), and
     never zooms (a pinch is the app's); added to a home screen it opens standalone with a black status bar, BASINS'
     ground.  manifest.json names it; icons/ holds the five icons (node starter/icons/make-icons.mjs draws them).
     Change NAME in the title, the apple title and manifest.json; change theme-color with your ground. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STARTER">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>an MIR app</title>   <!-- createApp({ name }) writes the app's name here -->
<!-- THE STARTER: the smallest whole MIR app.  Copy this folder, keep the kit beside it (../mir, ../fonts, ../LLM.md),
     and change the picture in app.js.  mir.css is every kit sheet in the kit's order; the app's own rules only lay
     the page out, and never restyle a kit part. -->
<link rel="stylesheet" href="../mir/mir.css">
<style>
  /* the app's own: where the picture sits */
  #picture { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body data-theme="dark" data-card="tinted">
<div id="lab">
  <div id="stage"><canvas id="picture" aria-hidden="true"></canvas></div>
</div>
<script type="module">
  /* the boot card shows while the app starts, and says in plain words what went wrong if it cannot */
  import { bootCard } from '../mir/shell/boot.js';
  const boot = bootCard({ steps: ['Loading the app'] });          // the app's name comes from createApp
  boot.step();
  import('./app.js').then(() => boot.done(), (error) => { console.error(error); boot.fail(error, { retry: () => location.reload() }); });
</script>
</body>
</html>
