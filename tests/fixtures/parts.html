<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIR · shell parts fixture</title>
<link rel="stylesheet" href="../../mir/css/base.css">
<link rel="stylesheet" href="../../mir/css/skin.css">
<link rel="stylesheet" href="../../mir/shell/shell.css">
<link rel="stylesheet" href="../../mir/core/core.css">
<link rel="stylesheet" href="../../mir/shell/parts.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a0f; }
  #stage { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #title { position: absolute; left: 16px; top: 12px; display: flex; gap: 6px; align-items: center; color: #fff; font: 700 14px sans-serif; }
  #title .mark { width: 18px; height: 18px; }
  #opener { position: absolute; left: 16px; top: 60px; }
  #card { position: absolute; left: 16px; top: 120px; width: 240px; height: 100px; }
</style>
</head>
<body data-theme="dark" data-card="tinted">
<canvas id="stage" width="640" height="400"></canvas>
<button id="opener" class="trig" type="button"><span class="trig-l">OPEN</span></button>
<div id="card" class="glass"></div>
<script type="module">
import { wordmark } from '../../mir/shell/wordmark.js';
import { setLanguage } from '../../mir/core/i18n.js';
import { unpseudo } from '../../mir/locales/pseudo.js';
import { openDialog, confirmDialog } from '../../mir/shell/dialog.js';
import { notice } from '../../mir/shell/notice.js';
import { busyMark, busyCursor, busyLogo } from '../../mir/shell/busy.js';
import { bootCard, explainBoot } from '../../mir/shell/boot.js';

const g = document.getElementById('stage').getContext('2d');
g.fillStyle = '#2a4a7a'; g.fillRect(0, 0, 640, 400); g.fillStyle = '#e0a040'; g.fillRect(200, 100, 240, 200);
wordmark(document.body, { word: 'MIR' });
const stageClicks = { n: 0 }; document.getElementById('stage').addEventListener('click', () => stageClicks.n++);
window.__T = { openDialog, confirmDialog, notice, busyMark, busyCursor, busyLogo, bootCard, explainBoot, stageClicks, setLanguage, unpseudo };
window.__ready = true;
</script>
</body>
</html>
