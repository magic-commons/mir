<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIR · modulation over timeline</title>
<!-- tests/modulation-stack.browser.mjs: the modulation window as the upper workspace over the TIMELINE (window/workspaces.js),
     the MIR switch in its preset bar, one registered parameter.  A 2D page, no GPU. -->
<link rel="stylesheet" href="../../mir/mir.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #card { position: fixed; left: 8px; top: 8px; width: 120px; padding: 10px; }
  #floats { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  #floats > * { pointer-events: auto; }
</style>
</head>
<body data-theme="dark">
<div id="card" class="glass"></div>
<div id="floats"></div>
<script type="module">
import { knob } from '../../mir/kit.js';
import { installModulation } from '../../mir/modulation/bind.js';
import { installTimeline } from '../../mir/timeline/bind.js';
import { createWorkspaces } from '../../mir/window/workspaces.js';
try { for (const k of Object.keys(localStorage)) if (k.startsWith('mir.test.ws')) localStorage.removeItem(k); } catch (_) {}
const S = { size: 0.5 };
const w = knob({ label: 'SIZE', min: 0, max: 1, value: S.size, onInput: (v) => { S.size = v; } });
document.getElementById('card').appendChild(w.root);
const params = [{ id: 'scene.size', label: 'SIZE', min: 0, max: 1, map: 'linear', get: () => S.size, set: (v) => { S.size = v; }, widget: w }];
let ws = null;
const mod = installModulation({ mount: document.getElementById('floats'), params, storageKey: 'mir.test.ws.mod', presetKey: 'mir.test.ws.presets',
  moved: (r) => ws && ws.moved('upper', r), onWindow: () => ws && ws.sync(), switchWorkspace: () => ws && ws.show('lower') });
const tl = installTimeline({ mount: document.getElementById('floats'), mod, storageKey: 'mir.test.ws.tl',
  moved: (r) => ws && ws.moved('lower', r), onWindow: () => ws && ws.sync(), initial: { open: false, h: 400, w: 1000, x: 140, y: 420 } });
mod.setTimeline(tl);
ws = createWorkspaces({ upper: mod.view, lower: tl.win });
window.__W = { mod, tl, ws };
window.__ready = true;
</script>
</body>
</html>
