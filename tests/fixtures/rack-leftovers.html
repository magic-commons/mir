<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIR · rack leftovers fixture</title>
<link rel="stylesheet" href="../../mir/css/base.css">
<link rel="stylesheet" href="../../mir/css/skin.css">
<link rel="stylesheet" href="../../mir/shell/shell.css">
<link rel="stylesheet" href="../../mir/shell/stage.css">
<link rel="stylesheet" href="../../mir/core/core.css">
<link rel="stylesheet" href="../../mir/window/window.css">
<link rel="stylesheet" href="../../mir/shell/rack.css">
<style>
  #ground { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fill { height: 120px; }
</style>
</head>
<body data-theme="dark" data-card="tinted">
<div id="lab">
  <div id="stage"><canvas id="ground"></canvas></div>
</div>
<script type="module">
import { el, readout } from '../../mir/kit.js';
import { createRack } from '../../mir/shell/rack.js';
import * as motion from '../../mir/core/motion.js';

if (new URLSearchParams(location.search).has('fresh')) localStorage.removeItem('mir.test.rack-leftovers');
const g = document.getElementById('ground'); g.width = innerWidth; g.height = innerHeight;
const c = g.getContext('2d'); for (let i = 0; i < 40; i++) { c.fillStyle = `hsl(${i * 37} 70% 45%)`; c.fillRect((i * 97) % innerWidth, (i * 53) % innerHeight, 160, 120); }

/* a stand-in notebook with the kit notebook's two calls */
const nb = { w: 640, h: 460, resized: [], size() { return { w: this.w, h: this.h, custom: this.w !== 640 || this.h !== 460 }; }, resize(w, h) { this.w = w; this.h = h; this.resized.push([w, h]); return [w, h]; } };
const rack = createRack({ host: document.getElementById('lab'), key: 'mir.test.rack-leftovers', scrollbar: true,
  retired: { oldscope: 'scope' }, notebook: () => nb });
const W = [['tone', 'TONE', 'right', true], ['mix', 'MIX', 'right', true], ['scope', 'SCOPE', 'right', false], ['eq', 'EQ', 'right', true],
  ['verb', 'VERB', 'right', true], ['meter', 'METER', 'right', true], ['display', 'DISPLAY', 'left', true], ['camera', 'CAMERA', 'left', true]];
for (const [id, title, side, open] of W) rack.register({ id, title, side, open,
  build(b, api) { b.appendChild(readout({ label: id.toUpperCase(), value: '42', sub: 'units' }).root); el('div', 'fill', b); api.setStatus('LIVE'); } });
rack.start();
window.__T = { rack, motion, nb };
window.__ready = true;
</script>
</body>
</html>
