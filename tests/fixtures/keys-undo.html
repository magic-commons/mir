<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>keys undo fixture</title>
<!-- tests/keys-undo.browser.mjs: a whole createApp() with the one history, the TIMELINE and one knob in a rack window
     (a snapshot domain 'scene'), so undo has one owner to prove: the key table's 'undo' / 'redo' rows. -->
<link rel="stylesheet" href="../../mir/mir.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  #lab, #stage { position: absolute; inset: 0; }
  #picture { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body data-theme="dark">
<div id="lab"><div id="stage"><canvas id="picture"></canvas></div></div>
<script type="module">
  import { createApp } from '../../mir/app.js';
  import { createHistory } from '../../mir/history/history.js';
  try { localStorage.clear(); } catch (_) {}
  const stage = document.getElementById('stage');
  const S = { size: 0.5 };
  const history = createHistory();
  const app = await createApp({ name: 'UNDO', key: 'undofx', stage, state: S, present: () => {}, history, timeline: true });
  let size = null;
  app.rack.register({ id: 'scene', title: 'SCENE', side: 'right', open: true, build: (body) => { size = app.param('size', 'SIZE', 0, 1); body.appendChild(size.root); } });
  app.rack.start();
  history.register('scene', { read: () => ({ size: S.size }), write: (s) => size && size.set(s.size) });
  await new Promise((r) => setTimeout(r, 50));
  history.clear('SESSION');
  window.__U = { app, history, S, at: () => (history.entries().find((r) => r.state === 'current') || { i: -1 }).i };
  window.__ready = true;
</script>
</body>
</html>
