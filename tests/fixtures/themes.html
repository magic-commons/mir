<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIR · themes fixture</title>
<!-- tests/themes.browser.mjs: a rack on the right (three windows: SPACING), sixteen cards (the shine's cost), a pane, and
     the GUI window, all on a 2D picture.  Every look is the kit's sheets; the rules below only lay the page out. -->
<link rel="stylesheet" href="../../mir/css/base.css">
<link rel="stylesheet" href="../../mir/css/skin.css">
<link rel="stylesheet" href="../../mir/css/tokens.css">
<link rel="stylesheet" href="../../mir/shell/shell.css">
<link rel="stylesheet" href="../../mir/core/core.css">
<link rel="stylesheet" href="../../mir/window/window.css">
<link rel="stylesheet" href="../../mir/shell/rack.css">
<link rel="stylesheet" href="../../mir/shell/gui.css">
<link rel="stylesheet" href="../../mir/controls/controls.css">
<link rel="stylesheet" href="../../mir/controls/colour-controls.css">
<link rel="stylesheet" href="../../mir/fx/fx.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  #ground { position: fixed; inset: 0; width: 100%; height: 100%; }
  #lab { position: fixed; inset: 0; }
  #cards { position: fixed; left: 12px; top: 12px; width: 760px; display: grid; grid-template-columns: repeat(4, 180px); gap: 14px; z-index: 20; }
  #cards > .dev { width: 180px; }
  #floats { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  #pane { position: fixed; left: 12px; bottom: 12px; width: 120px; height: 60px; z-index: 20; }
</style>
</head>
<body data-theme="dark" data-card="tinted">
<canvas id="ground" aria-hidden="true"></canvas>
<div id="lab"></div>
<div id="cards"></div>
<div id="pane" class="glass"></div>
<div id="floats"></div>
<script type="module">
import { el, knob, sw, trig, seg, device } from '../../mir/kit.js';
import { createRack } from '../../mir/shell/rack.js';
import { createGui } from '../../mir/shell/gui.js';

const g = document.getElementById('ground'); g.width = innerWidth; g.height = innerHeight;
const c = g.getContext('2d'); for (let i = 0; i < 40; i++) { c.fillStyle = `hsl(${i * 37} 70% 45%)`; c.fillRect((i * 97) % innerWidth, (i * 53) % innerHeight, 160, 120); }
if (new URLSearchParams(location.search).has('fresh')) { localStorage.removeItem('mir.test.themes'); localStorage.removeItem('mir.gui'); }

const gui = createGui({ host: document.getElementById('floats'), app: { name: 'THEMES FIXTURE' } });
const rack = createRack({ host: document.getElementById('lab'), key: 'mir.test.themes' });
for (const [id, title] of [['one', 'ONE'], ['two', 'TWO'], ['three', 'THREE']]) rack.register({ id, title, side: 'right', open: true,
  build(b) { b.appendChild(knob({ label: 'K', min: 0, max: 1, value: .5 }).root); b.appendChild(sw({ label: 'ON', value: true }).root); } });
rack.start();
for (let i = 0; i < 16; i++) { const d = device({ id: 'c' + i, eyebrow: 'CARD ' + (i + 1) }); const r = d.row(); r.append(trig({ label: 'GO' }).root, sw({ label: 'ON', value: i % 2 === 0 }).root); document.getElementById('cards').append(d.root); }
window.__T = { gui, rack, P: gui.prefs };
window.__ready = true;
</script>
</body>
</html>
